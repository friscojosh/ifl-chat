name: ifl-image
on:
  push:
    branches: [ifl/main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: IFL package tests
        working-directory: server
        run: make setup-go-work && go vet ./channels/app/ifl/ && go test ./channels/app/ifl/
      - name: Build webapp and team server package
        working-directory: server
        run: make build-client build-linux-amd64 package-linux-amd64 BUILD_ENTERPRISE=false
      - name: Image
        run: |
          cp server/dist/mattermost-team-linux-amd64.tar.gz server/build/
          docker build -f server/build/Dockerfile.ifl -t ghcr.io/${{ github.repository }}:${{ github.sha }} server/build
          docker run --rm --entrypoint /mattermost/bin/mattermost ghcr.io/${{ github.repository }}:${{ github.sha }} version
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
